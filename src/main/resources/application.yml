spring:
  application:
    name: baton
  main:
    banner-mode: off

server:
  port: 8080

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: backends,health

baton:
  backends:
    - name: deepseek
      url: https://api.deepseek.com/anthropic
      priority: 1
      skip-rules:
        - type: model-pattern
          pattern: "^claude-"
          mode: strict
        - type: content-type
          values: [image, document, redacted_thinking]
          mode: strict
    - name: airouter
      url: https://airouter.cloud
      priority: 2
    - name: callapi
      url: https://callapi.top
      priority: 3
  failover:
    connect-timeout: 3s
    read-timeout: 2m
    streaming-idle-timeout: 5m
    global-timeout: 3m
    max-body-size: 20971520
    max-concurrent-requests: 200
    health-check-interval: 30s
    health-check-threshold: 3
