# Integration test: 2 dead backends + 1 real Anthropic-compatible backend
# Tests failover by design: first 2 backends connection-refused → marked unhealthy → third succeeds
baton:
  backends:
    - name: dead-1
      url: http://localhost:19999
      priority: 1
    - name: dead-2
      url: http://localhost:19998
      priority: 2
    - name: real
      url: https://api.deepseek.com/anthropic
      priority: 3
  failover:
    connect-timeout: 2s
    read-timeout: 60s
    global-timeout: 30s
    max-body-size: 20971520
    max-concurrent-requests: 10
    health-check-interval: 60s
    health-check-threshold: 3
